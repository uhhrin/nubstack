name: loom
version: ${version}
main: dev.nubstack.loom.LoomPlugin
api-version: '26.2'
authors: [nubstack]
description: Cross-server player inventory sync
commands:
  loom:
    description: Inventory sync tools for staff
    usage: /loom [help|status|unlock|inspect|force-save|reload]
    permission: loom.use
permissions:
  loom.use:
    description: Run /loom (non-staff only see that sync is automatic)
    default: true
  loom.admin:
    description: Use /loom status, unlock, inspect, force-save and reload
    default: op
