# Local Velocity network: proxy + Paper hub (+ optional minigame) + Redis + MariaDB + docs.
# Join at localhost:${PROXY_HOST_PORT:-25565} (offline mode for Mineflayer bots).
# Docs: http://localhost:${DOCS_HOST_PORT:-8080}
#
# Default stack is intentionally light: one Paper backend.
# Second backend:
#   docker compose -f testbed/docker-compose.yml --profile minigame up -d
#
# Usage:
#   cp testbed/.env.example testbed/.env   # optional
#   ./scripts/use-java.sh ./gradlew build
#   ./testbed/scripts/sync-plugins.sh
#   docker compose -f testbed/docker-compose.yml up -d
#
# Wipe broken world volumes:
#   docker compose -f testbed/docker-compose.yml down -v

x-paper-env: &paper-env
  EULA: "TRUE"
  TYPE: PAPER
  VERSION: ${MC_VERSION:-26.2}
  ONLINE_MODE: "FALSE"
  DIFFICULTY: peaceful
  MODE: creative
  SPAWN_PROTECTION: "0"
  ENABLE_RCON: "true"
  RCON_PASSWORD: ${RCON_PASSWORD:-nubstack}
  RCON_PORT: 25575
  FORCE_GAMEMODE: "true"
  VIEW_DISTANCE: ${VIEW_DISTANCE:-4}
  SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-4}
  MAX_PLAYERS: ${MAX_PLAYERS:-10}
  SPAWN_MONSTERS: "false"
  SPAWN_ANIMALS: "false"
  SPAWN_NPCS: "false"
  USE_AIKAR_FLAGS: "false"
  JVM_XX_OPTS: "-XX:ActiveProcessorCount=${PAPER_CPU_COUNT:-2} -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  PAPER_VELOCITY_ENABLED: "true"
  PAPER_VELOCITY_ONLINE_MODE: "false"
  PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:-nubstack-forwarding-secret}
  # Mineflayer currently tops out at 26.1; ViaBackwards lets those bots join 26.2.
  MODRINTH_PROJECTS: viaversion,viabackwards
  # Interpolate ${CFG_*} placeholders while syncing plugin configs from /plugins.
  REPLACE_ENV_DURING_SYNC: "true"
  CFG_TETHER_DISCORD_TOKEN: ${TETHER_DISCORD_TOKEN:-}
  CFG_TETHER_DISCORD_CHANNEL_ID: ${TETHER_DISCORD_CHANNEL_ID:-}
  CFG_TETHER_DISCORD_GUILD_ID: ${TETHER_DISCORD_GUILD_ID:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    networks: [nubstack]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-nubstack}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nubstack}
      MARIADB_USER: ${MARIADB_USER:-nubstack}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-nubstack}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=150
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks: [nubstack]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  docs:
    image: nginx:alpine
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 32m
    ports:
      - "${DOCS_HOST_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks: [nubstack]

  velocity:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    depends_on:
      - hub
    ports:
      - "${PROXY_HOST_PORT:-25565}:25577"
    environment:
      TYPE: VELOCITY
      MEMORY: ${VELOCITY_MEMORY:-256M}
      JVM_XX_OPTS: "-XX:ActiveProcessorCount=1"
    volumes:
      - ./velocity/velocity.toml:/config/velocity.toml:ro
      - ./velocity/forwarding.secret:/config/forwarding.secret:ro
      - ./plugins/velocity:/plugins:ro
      - velocity-data:/server
    networks: [nubstack]

  hub:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    cpus: ${PAPER_CPUS:-1.5}
    mem_limit: ${HUB_MEM_LIMIT:-1280m}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *paper-env
      MEMORY: ${HUB_MEMORY:-1G}
    volumes:
      - hub-data:/data
      - ./plugins/paper:/plugins:ro
      - ./config:/config:ro
    networks: [nubstack]

  # Optional second backend. Enable with: --profile minigame
  minigame:
    profiles: ["minigame"]
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    cpus: ${PAPER_CPUS:-1.5}
    mem_limit: ${MINIGAME_MEM_LIMIT:-1280m}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *paper-env
      MEMORY: ${MINIGAME_MEMORY:-1G}
    volumes:
      - minigame-data:/data
      - ./plugins/paper:/plugins:ro
      - ./config:/config:ro
    networks: [nubstack]

  bots:
    image: node:22-alpine
    profiles: ["bots"]
    working_dir: /bots
    depends_on:
      - velocity
    environment:
      PROXY_HOST: velocity
      PROXY_PORT: "25577"
      BOT_COUNT: ${BOT_COUNT:-3}
    volumes:
      - ./bots:/bots
    command: ["sh", "-c", "npm install && npm run smoke"]
    networks: [nubstack]

networks:
  nubstack:

volumes:
  velocity-data:
  hub-data:
  minigame-data:
  mariadb-data:
