name: release

# Builds jars for an existing version tag and publishes a GitHub Release.
# Never creates tags: push an annotated tag (or ensure it exists) first.
on:
  push:
    tags:
      - "nubstack-v*"
      - "spine-v*"
      - "aegis-paper-v*"
      - "aegis-velocity-v*"
      - "aegis-common-v*"
      - "harbor-v*"
      - "loom-v*"
      - "spotlight-v*"
      - "gatekeep-v*"
      - "ledger-v*"
      - "cull-v*"
      - "amber-v*"
      - "tether-v*"
      - "cairn-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0); tag must already exist"
        required: true
        type: string
      modules:
        description: "all, or a single Gradle module name"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            MODULES="${{ inputs.modules }}"
            TAG="nubstack-v${VERSION}"
            PREFIX="nubstack"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG##*-v}"
            PREFIX="${TAG%-v*}"
            if [[ "$PREFIX" == "nubstack" ]]; then
              MODULES="all"
            else
              MODULES="$PREFIX"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "modules=${MODULES}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION} modules=${MODULES}"

      - name: Require existing tag and check it out
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} does not exist. Create it locally and push before releasing."
            exit 1
          fi
          git checkout --detach "refs/tags/${TAG}"

      - name: Writing policy
        run: ./scripts/check-writing-policy.sh

      - name: Build selected modules
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          MODULES="${{ steps.meta.outputs.modules }}"
          if [[ "$MODULES" == "all" ]]; then
            ./gradlew build --no-daemon -Pversion="$VERSION"
          else
            ./gradlew ":${MODULES}:build" --no-daemon -Pversion="$VERSION"
          fi

      - name: Collect release jars and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          # Prefer shaded / remapped jars; skip sources, javadoc, plain, and Loom -dev.
          # cairn (Fabric Loom) lands remapped output under cairn/build/libs/*.jar.
          while IFS= read -r jar; do
            base="$(basename "$jar")"
            case "$base" in
              *-sources.jar|*-javadoc.jar|*-plain.jar|*-dev.jar|*-dev-shadow.jar) continue ;;
            esac
            cp -f "$jar" "dist/$base"
          done < <(find . -path '*/build/libs/*.jar' ! -path './build/*' -type f | sort)
          echo "Collected jars:"
          ls -la dist
          test "$(find dist -name '*.jar' | wc -l)" -gt 0
          (
            cd dist
            sha256sum -- *.jar | tee SHA256SUMS.txt
          )

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --current --strip header --tag-pattern "^${{ steps.meta.outputs.prefix }}-v[0-9]"
          version: v2.8.0
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "nubstack ${{ steps.meta.outputs.version }}"
          body: ${{ steps.git-cliff.outputs.content }}
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # Tag must already exist (see Require existing tag).
          make_latest: ${{ startsWith(steps.meta.outputs.tag, 'nubstack-v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
